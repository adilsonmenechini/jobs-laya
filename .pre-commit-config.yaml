# pre-commit hooks — run on every `git commit` (install: `make hooks`).
# Manual run over everything: `uv run pre-commit run --all-files`
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key

  # Same ruff version as the project's dev extra — lint and format stay in sync.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Static security analysis on the shipped code (medium+ findings fail).
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        name: bandit (security)
        args: ["-r", "app", "-ll"]
        pass_filenames: false

  - repo: local
    hooks:
      # Secret scanner (brew install gitleaks) — scans the staged diff only.
      - id: gitleaks
        name: gitleaks (secrets)
        entry: gitleaks git --staged --redact
        language: system
        pass_filenames: false
      # The suite runs in ~0.5s (tests use a temp DB and a FakeEngine —
      # no model download, no browser).
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        types: [python]

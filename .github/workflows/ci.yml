# CI — PR checks: linter (ruff), segurança (bandit + gitleaks) e testes (pytest).
# Branch protection em `develop` deve exigir os checks `lint`, `security` e `test`.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # No uv cache here: the test job owns it (same uv.lock key would
      # collide with a 409 on save) and ruff is the only tool needed.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: false

      # Pin ruff to the version in uv.lock so CI, pre-commit and local
      # dev can never drift apart (format results included).
      - name: Ruff version (from uv.lock)
        id: ruff
        run: |
          version=$(grep -A1 '^name = "ruff"$' uv.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: ruff check
        run: uvx "ruff==${{ steps.ruff.outputs.version }}" check .

      - name: ruff format --check
        run: uvx "ruff==${{ steps.ruff.outputs.version }}" format --check .

  # Safety net for what the local pre-commit hooks cover: without this,
  # `--no-verify` (or any tool-made commit) would skip bandit and gitleaks
  # entirely. Versions pinned to match `.pre-commit-config.yaml`.
  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: false

      # Same invocation as the pre-commit hook: medium+ findings fail.
      - name: bandit (security)
        run: uvx "bandit==1.9.4" -r app -ll

      # Full-repo scan: `gitleaks git --staged` only exists locally (CI
      # checkouts have no staged diff), so `dir .` covers every tracked file.
      - name: gitleaks (secrets)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir . --redact --no-banner

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-python: true

      # --locked fails the build when pyproject.toml and uv.lock drift.
      - name: Install dependencies
        run: uv sync --extra dev --locked

      # Tests are hermetic: temp DB (conftest), FakeEngine, local fixtures,
      # httpx.MockTransport — no network and no model download.
      - name: pytest
        run: uv run --frozen pytest -q
